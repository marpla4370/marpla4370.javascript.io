<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width-device-width,initial-scale=1.0">
        <title>My Portfolio</title>

    </head>
    <body>

        <header>
            <div id="welcome-msg">Welcome!</div>
            <nav>
                <ul>
                    <li><a href="#about">About</a></li>
                    <li><a href="#projects">Projects</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </nav>
        </header>
      
        <main>
        <section id="about">
            <h2>About Me</h2>
            <p>Hello, Im a software devleopment student in college. I work from home, and im married with a dog.</p>
        </section>
         <section id="projects">
            <h2>Projects</h2>
            <div class="project-links">
                <a href="placeholder">
                    <img src="placeholder" alt="Project 1">
                    <p> </p>
                </a>
                <a href="placeholder">
                    <img src="placeholder" alt="Project 2">
                    <p> </p>
                </a>
                <a href="placeholder">
                    <img src="placeholder" alt="Project 3">
                    <p> </p>
                </a>
            </div>
        </section>
        <section id="contact">
            <h2>Contact Me</h2>
            <form>
                <div>
                    <label for="name">Sender Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div>
                    <label for="email">Address (Email):</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div>
                    <label for="subject">Subject:</label>
                    <input type="text" id="subject" name="subject" required>
                </div>
                <div>
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="4" required></textarea>
                </div>
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>
       <script>
        const userName = prompt("What is your name?");
        const welcomeDisplay = document.getElementById("welcome-msg");

        (userName && userName.trim()) && (welcomeDisplay.textContent = `Welcome, ${userName}!`);
   
    </script>
