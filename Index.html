<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width-device-width,initial-scale=1.0">
        <title>My Portfolio</title>

        <style>
            .dark-mode {
                background-color: #1a1a1a;
                color: #ffffff;
            }

            .content-box {
                border: 1px solid #ccc;
                padding: 15px;
                margin: 10px 0;
            }

            .hidden {
                display: none;
            }
        </style>
    </head>
    <body>
        <div style="text-align: right; padding: 10px;">
            <label class="switch">
                <input type="checkbox" id="darkModeToggle">
                <span class="slider"></span> Dark Mode
            </label>
        </div>
        <header>
            <div id="welcome-msg">Welcome!</div>
            <nav>
                <ul>
                    <li><a href="#about">About</a></li>
                    <li><a href="#projects">Projects</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </nav>
        </header>
      
        <main>
        <section id="about">
            <h2>About Me</h2>
            <p>Hello, Im a software devleopment student in college. I work from home, and im married with a dog.</p>
            <ul id="skillsList"></ul>
        </section>
           
        <section id="featured-content">
            <h2>Featured Content</h2>
    
            <div id="universityResources" class="content-box">
                <h3>University Resources</h3>
                <a href="https://www.ecpi.edu/programs/software-development-bachelor-degree">ECPI Program Home Page</a>
            </div>

            <div id="personalProjects" class="content-box">
                <h3>Personal Projects</h3>
                <a href="https://github.com/marpla4370/marpla4370.final.io"><img src="https://githubassets.com" alt="GitHub" width="50"></a>
            </div>
        </section>
         <section id="projects">
            <h2>Projects</h2>
            <div class="project-links">
                <a href="placeholder">

                </a>

                    <p> </p>
                </a>
                <a href="placeholder">
                    <img src="placeholder" alt="Project 3">
                    <p> </p>
                </a>
            </div>
        </section>
        <section id="contact">
            <h2>Contact Me</h2>
            <form>
                <div>
                    <label for="name">Sender Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div>
                    <label for="email">Address (Email):</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div>
                    <label for="subject">Subject:</label>
                    <input type="text" id="subject" name="subject" required>
                </div>
                <div>
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="4" required></textarea>
                </div>
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>
       <script>
        const userName = prompt("What is your name?");
        const welcomeDisplay = document.getElementById("welcome-msg");

        (userName && userName.trim()) && (welcomeDisplay.textContent = `Welcome, ${userName}!`);

        const projects = ["Project 1", "Project 2"];
        const uniDiv = document.getElementById("universityResources");
        const personalDiv = document.getElementById("personalProjects");

        if (projects.length < 3) {
            uniDiv.classList.remove("hidden");
            personalDiv.classList.remove("hidden");
        } else {
            personalDiv.classList.remove("hidden");
            uniDiv.classList.add("hidden");
        }

        const skills = ["HTML", "CSS", "JavaScript", "Git", "GitHub"];
        const listContainer = document.getElementById("skillsList");

        skills.forEach(skill => {
            let li = document.createElement("li");
            li.textContent = skill;
            listContainer.appendChild(li);
        });

        const toggle = document.getElementById("darkModeToggle");

        toggle.addEventListener("change", function() {
            document.body.classList.toggle("dark-mode");
        });

        const contactForm = document.querySelector("form"); 
        const submitBtn = document.getElementById("sButton"); 

        submitBtn.addEventListener("click", function(event) {
            event.preventDefault(); 
    
            const userName = document.getElementById("name").value;
    
        
                alert("Thank you, " + userName + ", your message has been sent!");
         
        });
   
    </script>
